<ion-content [fullscreen]="true" class="splash-content no-texture">

  <div class="splash-container">

    <!-- LOGO / FORME CENTRALE -->
    <div class="logo-wrapper">

      <div class="glow"></div>

      <!-- SCÈNES ANIMÉES (3 s chacune) -->
      <div class="scene-stage">

        <!-- 1. Croix de l'église -->
        <svg class="scene" [class.active]="currentScene === 0" viewBox="0 0 100 100" aria-hidden="true">
          <path class="trait" pathLength="1" d="M50 12 L50 88" />
          <path class="trait" pathLength="1" d="M32 32 L68 32" />
          <g class="rayons">
            <path class="trait fin" pathLength="1" d="M50 6 L50 2" />
            <path class="trait fin" pathLength="1" d="M28 14 L24 10" />
            <path class="trait fin" pathLength="1" d="M72 14 L76 10" />
            <path class="trait fin" pathLength="1" d="M20 32 L14 32" />
            <path class="trait fin" pathLength="1" d="M80 32 L86 32" />
          </g>
          <path class="trait fin sol" pathLength="1" d="M30 92 L70 92" />
        </svg>

        <!-- 2. Personne à genoux en prière -->
        <svg class="scene" [class.active]="currentScene === 1" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="trait" pathLength="1" cx="56" cy="22" r="7" />
          <path class="trait" pathLength="1" d="M51 31 C45 41 43 50 45 60" />
          <path class="trait" pathLength="1" d="M45 60 L50 81 L27 81" />
          <path class="trait" pathLength="1" d="M51 38 L60 51 L68 39 L70 30" />
          <g class="rayons">
            <path class="trait fin" pathLength="1" d="M76 14 L81 9" />
            <path class="trait fin" pathLength="1" d="M80 22 L87 20" />
            <path class="trait fin" pathLength="1" d="M70 10 L71 4" />
          </g>
          <path class="trait fin sol" pathLength="1" d="M18 88 L82 88" />
        </svg>

        <!-- 3. Bible ouverte -->
        <svg class="scene" [class.active]="currentScene === 2" viewBox="0 0 100 100" aria-hidden="true">
          <path class="trait" pathLength="1" d="M50 36 C40 30 28 30 18 34 L18 74 C28 70 40 70 50 76 Z" />
          <path class="trait" pathLength="1" d="M50 36 C60 30 72 30 82 34 L82 74 C72 70 60 70 50 76 Z" />
          <path class="trait fin" pathLength="1" d="M65 44 L65 62 M58 50 L72 50" />
          <g class="rayons">
            <path class="trait fin" pathLength="1" d="M50 24 L50 14" />
            <path class="trait fin" pathLength="1" d="M37 26 L32 18" />
            <path class="trait fin" pathLength="1" d="M63 26 L68 18" />
          </g>
        </svg>

      </div>

    </div>

    <!-- NOM DE L'APPLICATION -->
    <div class="app-name">
      <span>Fléchissons</span><br/> nos génoux
    </div>

    <!-- MESSAGE DYNAMIQUE -->
    <div class="loading-area">

      <p class="loading-text">
        {{ loadingMessages[currentMessage] }}
      </p>

      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>

  </div>

</ion-content>
