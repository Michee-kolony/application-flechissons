<ion-content
  [fullscreen]="true"
  [scrollY]="true"
  class="login-content no-texture"
>

  <div class="login-page">

    <!-- =================================================
         EN-TÊTE (zone foncée avec courbe)
    ================================================== -->

    <header class="login-hero">

      <a class="login-back" routerLink="/tabs/tab1" aria-label="Retour">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </a>

      <h1 class="login-title">Bon<br>retour</h1>

      <svg class="login-curve" viewBox="0 0 390 90" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 0H390V34C285 78 140 92 0 70Z" />
      </svg>

    </header>


    <!-- =================================================
         FORMULAIRE
    ================================================== -->

    <main class="login-form">

      <p *ngIf="registeredMessage" class="login-notice">
        {{ registeredMessage }}
      </p>

      <!-- EMAIL -->
      <label
        class="login-field"
        [class.login-field--active]="loginData.email"
        [class.login-field--error]="errors.email"
      >
        <span class="login-label">E-mail</span>
        <ion-input
          [(ngModel)]="loginData.email"
          (ngModelChange)="clearError('email')"
          type="email"
          inputmode="email"
          autocomplete="email"
          [disabled]="isLoading"
        ></ion-input>
      </label>
      <p *ngIf="errors.email" class="login-error">{{ errors.email }}</p>

      <!-- MOT DE PASSE -->
      <label
        class="login-field"
        [class.login-field--active]="loginData.password"
        [class.login-field--error]="errors.password"
      >
        <span class="login-label">Mot de passe</span>
        <div class="login-field__row">
          <ion-input
            [(ngModel)]="loginData.password"
            (ngModelChange)="clearError('password')"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
            [disabled]="isLoading"
            (keyup.enter)="login()"
          ></ion-input>
          <button
            *ngIf="loginData.password"
            type="button"
            class="login-toggle"
            [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            (click)="togglePasswordVisibility()"
          >
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </label>
      <p *ngIf="errors.password" class="login-error">{{ errors.password }}</p>

      <div class="login-forgot">
        <a routerLink="/forgot-password">Mot de passe oublié ?</a>
      </div>

      <!-- ERREUR GÉNÉRALE (serveur, réseau…) -->
      <p *ngIf="formError" class="login-error login-error--form">{{ formError }}</p>

      <!-- BOUTON -->
      <button
        type="button"
        class="login-btn"
        (click)="login()"
        [disabled]="isLoading"
      >
        <span *ngIf="isLoading" class="login-spinner"></span>
        {{ isLoading ? 'Connexion...' : 'Se connecter' }}
      </button>

    </main>


    <!-- =================================================
         INSCRIPTION
    ================================================== -->

    <footer class="login-signup">
      Pas encore de compte ?
      <a routerLink="/signup">S'inscrire</a>
    </footer>

  </div>

</ion-content>
