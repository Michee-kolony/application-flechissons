<!-- tab4.page.html -->
<ion-header class="profil-header ion-no-border">
  <ion-toolbar>
    <div class="topbar container">
      <div>
        <span class="kicker">MON COMPTE</span>
        <h1>Profil</h1>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="profil-page">
    <!-- ================================================= -->
    <!-- SECTION HÉROS - MÊME DESIGN QUE LES AUTRES -->
    <!-- ================================================= -->
    <section class="profil-hero">
      <div class="profil-hero-content">
        <!-- Photo / Initiale -->
        <div class="profil-avatar-wrapper">
          <div class="profil-avatar" [class.has-photo]="hasPhoto">
            <img *ngIf="hasPhoto" 
                 [src]="user.photo" 
                 [alt]="fullName" 
                 class="profil-avatar-img" 
                 referrerpolicy="no-referrer"
                 (error)="onPhotoError()">
            <span *ngIf="!hasPhoto" class="profil-avatar-initiale">
              {{ userInitial }}
            </span>
          </div>
        </div>

        <!-- Infos -->
        <div class="profil-info">
          <h2 class="profil-name">{{ fullName }}</h2>
          <p class="profil-email">{{ user.email || 'Email non renseigné' }}</p>
          
          <div class="profil-badge-wrapper">
            <div *ngIf="user.profilComplete" class="profil-badge profil-badge--complete">
              <ion-icon name="checkmark-circle"></ion-icon>
              <span>Profil complet</span>
            </div>
            <div *ngIf="!user.profilComplete" class="profil-badge profil-badge--incomplete">
              <ion-icon name="information-circle-outline"></ion-icon>
              <span>À compléter</span>
            </div>
          </div>

          <button type="button" [routerLink]="['/editprofil']" class="profil-edit-btn">
            <ion-icon name="create-outline"></ion-icon>
            Modifier
          </button>
        </div>
      </div>
    </section>

    <!-- ================================================= -->
    <!-- MENU CARTES OPTIONS -->
    <!-- ================================================= -->
    <div class="menu-options">

      <!-- Carte 1 : Faire un don -->
      <div [routerLink]="['/checkout']" class="menu-card">
        <div class="menu-card-icon">
          <ion-icon name="heart-outline"></ion-icon>
        </div>
        <div class="menu-card-content">
          <h3>Faire un don</h3>
          <p>Soutenir notre mission</p>
        </div>
        <ion-icon name="chevron-forward-outline" class="menu-card-arrow"></ion-icon>
      </div>

      <!-- Carte 2 : FAQ -->
      <div [routerLink]="['/faq']" class="menu-card">
        <div class="menu-card-icon">
          <ion-icon name="help-circle-outline"></ion-icon>
        </div>
        <div class="menu-card-content">
          <h3>FAQ</h3>
          <p>Questions fréquentes</p>
        </div>
        <ion-icon name="chevron-forward-outline" class="menu-card-arrow"></ion-icon>
      </div>

      <!-- Carte 3 : Lire la Bible -->
      <div [routerLink]="['/bible']" class="menu-card">
        <div class="menu-card-icon">
          <ion-icon name="book-outline"></ion-icon>
        </div>
        <div class="menu-card-content">
          <h3>Lire la Bible</h3>
          <p>La parole de Dieu</p>
        </div>
        <ion-icon name="chevron-forward-outline" class="menu-card-arrow"></ion-icon>
      </div>

      <!-- Carte 4 : Confidentialité -->
      <div [routerLink]="['/privacy']" class="menu-card">
        <div class="menu-card-icon">
          <ion-icon name="lock-closed-outline"></ion-icon>
        </div>
        <div class="menu-card-content">
          <h3>Votre activité est protégée</h3>
          <p>Politique de confidentialité</p>
        </div>
        <ion-icon name="chevron-forward-outline" class="menu-card-arrow"></ion-icon>
      </div>

      <!-- Carte 5 : Déconnexion -->
      <button type="button" (click)="logout()" [disabled]="isLoading" class="menu-card menu-card--danger">
        <div class="menu-card-icon">
          <ion-spinner *ngIf="isLoading" name="crescent" class="spinner-danger"></ion-spinner>
          <ion-icon *ngIf="!isLoading" name="log-out-outline"></ion-icon>
        </div>
        <div class="menu-card-content">
          <h3 *ngIf="!isLoading">Déconnexion</h3>
          <h3 *ngIf="isLoading">Déconnexion...</h3>
          <p>Quitter votre compte</p>
        </div>
        <ion-icon *ngIf="!isLoading" name="chevron-forward-outline" class="menu-card-arrow menu-card-arrow--danger"></ion-icon>
      </button>

    </div>

    <!-- Version de l'app -->
    <div class="profil-version">
      <span>Version 1.0.0</span>
    </div>
  </main>
</ion-content>
