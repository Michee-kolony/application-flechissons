<ion-header class="ion-no-border">
  <ion-toolbar class="container">
    <div class="flex items-center py-2 justify-between w-full">
      <!-- TITRE -->
      <div>
        <h1 class="text-xl font-bold text-orange-500">Profil</h1>
        <p class="text-sm text-gray-500">Bienvenue dans votre espace profil</p>
      </div>
      <!-- Bouton rafraîchir -->
      <button type="button" (click)="refreshData()" class="text-orange-500">
        <ion-icon name="refresh-outline" class="text-2xl"></ion-icon>
      </button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" style="--padding-top: 0px !important; --padding-start: 0px !important; --padding-end: 0px !important;">
  <div class="px-4 py-4">

    <!-- ================================================= -->
    <!-- SECTION HÉROS RECTANGULAIRE PLEINE LARGEUR -->
    <!-- ================================================= -->
    <div class="relative bg-gradient-to-r from-orange-500 to-orange-600 rounded-2xl p-6 text-white shadow-lg overflow-hidden w-full">

      <!-- Décorations -->
      <div class="absolute -top-16 -right-16 w-32 h-32 rounded-full bg-white/10"></div>
      <div class="absolute -bottom-16 -left-16 w-40 h-40 rounded-full bg-white/5"></div>
      <div class="absolute top-1/2 -right-8 w-20 h-20 rounded-full bg-white/5"></div>

      <div class="relative z-10">
        <!-- Ligne 1 : Photo + Nom + Email -->
        <div class="flex items-center gap-4">
          <!-- Photo / Initiale -->
          <div class="w-20 h-20 rounded-full flex items-center justify-center shadow-lg overflow-hidden flex-shrink-0"
               [class.bg-white]="hasPhoto"
               [class.bg-orange-400]="!hasPhoto">
            
            <img *ngIf="hasPhoto" 
                 [src]="user.photo" 
                 [alt]="fullName" 
                 class="w-full h-full object-cover" 
                 referrerpolicy="no-referrer"
                 (error)="onPhotoError()">
            
            <span *ngIf="!hasPhoto" 
                  class="text-3xl font-bold text-white">
              {{ userInitial }}
            </span>
          </div>

          <!-- Infos -->
          <div class="min-w-0 flex-1">
            <h2 class="text-xl font-bold truncate">{{ fullName }}</h2>
            <p class="text-orange-100 text-sm truncate">{{ user.email || 'Email non renseigné' }}</p>
          </div>
        </div>

        <!-- Ligne 2 : Badge statut + Bouton modifier -->
        <div class="flex items-center justify-between mt-4 flex-wrap gap-3">
          <div *ngIf="user.profilComplete" class="inline-flex items-center gap-2 bg-white/20 rounded-full px-4 py-1.5">
            <ion-icon name="checkmark-circle" class="text-base"></ion-icon>
            <span class="text-xs font-medium">Profil complet</span>
          </div>
          <div *ngIf="!user.profilComplete" class="inline-flex items-center gap-2 bg-white/20 rounded-full px-4 py-1.5">
            <ion-icon name="information-circle-outline" class="text-base"></ion-icon>
            <span class="text-xs font-medium">À compléter</span>
          </div>

          <button type="button" (click)="editProfile()" class="bg-white text-orange-600 px-5 py-2 rounded-lg text-sm font-semibold shadow-md hover:bg-orange-50 transition-colors">
            Modifier
          </button>
        </div>
      </div>
    </div>

    <!-- ================================================= -->
    <!-- MENU CARTES OPTIONS - DESIGN FIN ET ÉPURÉ -->
    <!-- ================================================= -->
    <div class="mt-6 space-y-2.5">

      <!-- Carte 1 : Faire un don -->
      <div [routerLink]="['/checkout']" class="bg-white rounded-xl px-5 py-3.5 shadow-sm border border-gray-100 flex items-center justify-between cursor-pointer hover:shadow-md transition-all hover:border-orange-200 active:scale-[0.98]">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center flex-shrink-0">
            <ion-icon name="heart-outline" class="text-orange-500 text-xl"></ion-icon>
          </div>
          <h3 class="font-semibold text-gray-800 text-sm">Faire un don</h3>
        </div>
        <ion-icon name="chevron-forward-outline" class="text-gray-400 text-sm"></ion-icon>
      </div>

      <!-- Carte 2 : FAQ -->
      <div class="bg-white rounded-xl px-5 py-3.5 shadow-sm border border-gray-100 flex items-center justify-between cursor-pointer hover:shadow-md transition-all hover:border-orange-200 active:scale-[0.98]">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center flex-shrink-0">
            <ion-icon name="help-circle-outline" class="text-orange-500 text-xl"></ion-icon>
          </div>
          <h3 class="font-semibold text-gray-800 text-sm">FAQ</h3>
        </div>
        <ion-icon name="chevron-forward-outline" class="text-gray-400 text-sm"></ion-icon>
      </div>

      <!-- Carte 3 : Vidéos likées -->
      <div class="bg-white rounded-xl px-5 py-3.5 shadow-sm border border-gray-100 flex items-center justify-between cursor-pointer hover:shadow-md transition-all hover:border-orange-200 active:scale-[0.98]">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center flex-shrink-0">
            <ion-icon name="play-circle-outline" class="text-orange-500 text-xl"></ion-icon>
          </div>
          <h3 class="font-semibold text-gray-800 text-sm">Vidéos likées</h3>
        </div>
        <ion-icon name="chevron-forward-outline" class="text-gray-400 text-sm"></ion-icon>
      </div>

      <!-- Carte 4 : Déconnexion -->
      <button type="button" (click)="logout()" [disabled]="isLoading" class="w-full bg-white rounded-xl px-5 py-3.5 shadow-sm border border-red-100 flex items-center justify-between hover:shadow-md transition-all hover:border-red-300 active:scale-[0.98]">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0">
            <ion-spinner *ngIf="isLoading" name="crescent" class="text-red-500 text-xl"></ion-spinner>
            <ion-icon *ngIf="!isLoading" name="log-out-outline" class="text-red-500 text-xl"></ion-icon>
          </div>
          <h3 class="font-semibold text-red-500 text-sm">
            <span *ngIf="!isLoading">Déconnexion</span>
            <span *ngIf="isLoading">Déconnexion...</span>
          </h3>
        </div>
        <ion-icon *ngIf="!isLoading" name="chevron-forward-outline" class="text-red-300 text-sm"></ion-icon>
      </button>

    </div>

  </div>
</ion-content>
