<ion-content
  [fullscreen]="true"
  [scrollY]="true"
  class="login-content no-texture"
>

  <div class="login-page">

    <!-- =================================================
         EN-TÊTE (zone foncée avec courbe)
    ================================================== -->

    <header class="login-hero">

      <!-- Étape 2 : revient à l'étape 1 / Étape 1 : revient à la connexion -->
      <button
        *ngIf="currentStep === 2"
        type="button"
        class="login-back"
        aria-label="Retour"
        (click)="prevStep()"
        [disabled]="isLoading"
      >
        <ion-icon name="chevron-back-outline"></ion-icon>
      </button>

      <a
        *ngIf="currentStep === 1"
        class="login-back"
        routerLink="/login"
        aria-label="Retour"
      >
        <ion-icon name="chevron-back-outline"></ion-icon>
      </a>

      <h1 class="login-title">Créer un<br>compte</h1>

      <!-- PROGRESSION -->
      <div class="signup-steps">
        <span>Étape {{ currentStep }} sur 2</span>
        <i class="active"></i>
        <i [class.active]="currentStep >= 2"></i>
      </div>

      <svg class="login-curve" viewBox="0 0 390 90" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 0H390V34C285 78 140 92 0 70Z" />
      </svg>

    </header>


    <!-- =================================================
         FORMULAIRE
    ================================================== -->

    <main class="login-form">

      <!-- =================================================
           ÉTAPE 1 — PROFIL
      ================================================== -->

      <div *ngIf="currentStep === 1" class="signup-step">

        <label
          class="login-field"
          [class.login-field--active]="userData.fullName"
          [class.login-field--error]="errors.fullName"
        >
          <span class="login-label">Nom complet</span>
          <ion-input
            [(ngModel)]="userData.fullName"
            (ngModelChange)="clearError('fullName')"
            type="text"
            autocomplete="name"
            autocapitalize="words"
            [disabled]="isLoading"
            (keyup.enter)="nextStep()"
          ></ion-input>
        </label>
        <p *ngIf="errors.fullName" class="login-error">{{ errors.fullName }}</p>

        <button
          type="button"
          class="login-btn signup-btn"
          (click)="nextStep()"
          [disabled]="isLoading"
        >
          Continuer
        </button>

      </div>


      <!-- =================================================
           ÉTAPE 2 — IDENTIFIANTS
      ================================================== -->

      <div *ngIf="currentStep === 2" class="signup-step">

        <!-- EMAIL -->
        <label
          class="login-field"
          [class.login-field--active]="userData.email"
          [class.login-field--error]="errors.email"
        >
          <span class="login-label">E-mail</span>
          <ion-input
            [(ngModel)]="userData.email"
            (ngModelChange)="clearError('email')"
            type="email"
            inputmode="email"
            autocomplete="email"
            [disabled]="isLoading"
          ></ion-input>
        </label>
        <p *ngIf="errors.email" class="login-error">{{ errors.email }}</p>

        <!-- MOT DE PASSE -->
        <label
          class="login-field"
          [class.login-field--active]="userData.password"
          [class.login-field--error]="errors.password"
        >
          <span class="login-label">Mot de passe</span>
          <div class="login-field__row">
            <ion-input
              [(ngModel)]="userData.password"
              (ngModelChange)="clearError('password')"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="new-password"
              [disabled]="isLoading"
            ></ion-input>
            <button
              *ngIf="userData.password"
              type="button"
              class="login-toggle"
              [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
              (click)="togglePasswordVisibility()"
            >
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </label>
        <p *ngIf="errors.password" class="login-error">{{ errors.password }}</p>

        <!-- CONFIRMATION -->
        <label
          class="login-field"
          [class.login-field--active]="userData.confirmPassword"
          [class.login-field--error]="errors.confirmPassword"
        >
          <span class="login-label">Confirmer le mot de passe</span>
          <div class="login-field__row">
            <ion-input
              [(ngModel)]="userData.confirmPassword"
              (ngModelChange)="clearError('confirmPassword')"
              [type]="showConfirmPassword ? 'text' : 'password'"
              autocomplete="new-password"
              [disabled]="isLoading"
              (keyup.enter)="submitForm()"
            ></ion-input>
            <button
              *ngIf="userData.confirmPassword"
              type="button"
              class="login-toggle"
              [attr.aria-label]="showConfirmPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
              (click)="toggleConfirmPasswordVisibility()"
            >
              <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </label>
        <p *ngIf="errors.confirmPassword" class="login-error">{{ errors.confirmPassword }}</p>

        <!-- ERREUR GÉNÉRALE (serveur, réseau…) -->
        <p *ngIf="formError" class="login-error login-error--form signup-form-error">{{ formError }}</p>

        <button
          type="button"
          class="login-btn signup-btn"
          (click)="submitForm()"
          [disabled]="isLoading"
        >
          <span *ngIf="isLoading" class="login-spinner"></span>
          {{ isLoading ? 'Création...' : "S'inscrire" }}
        </button>

      </div>

    </main>


    <!-- =================================================
         CONNEXION
    ================================================== -->

    <footer class="login-signup">
      Déjà un compte ?
      <a routerLink="/login">Se connecter</a>
    </footer>

  </div>

</ion-content>
