<ion-header class="ion-no-border">

  <ion-toolbar class="px-4 py-3 !bg-white !shadow-sm">

    <div class="flex items-center gap-4 w-full">

      <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center">

        <ion-back-button
          defaultHref="/tabs/tab1"
          text=""
          class="text-orange-500">
        </ion-back-button>

      </div>


      <div>

        <h1 class="text-xl font-bold text-gray-900">
          Nos directs
        </h1>

        <p class="text-xs text-gray-500">
          Cultes et moments spirituels en direct
        </p>

      </div>


    </div>

  </ion-toolbar>

</ion-header>





<ion-content [fullscreen]="true" class="!bg-gray-100">


<div class="pt-6 px-4 pb-10 space-y-6">



<div>

<h2 class="text-2xl font-bold text-gray-900">
Nos plateformes
</h2>


<p class="text-gray-500 mt-1 text-sm">
Suivez nos cultes et enseignements où que vous soyez.
</p>


</div>







<!-- TikTok -->

<div class="relative h-56 rounded-3xl overflow-hidden shadow-xl group">


<img
src="https://images.unsplash.com/photo-1438232992991-995b7058bbb3?w=1200"
class="absolute inset-0 w-full h-full object-cover transition duration-700 group-hover:scale-110">


<div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/50 to-black/20"></div>



<div class="absolute top-4 right-4 bg-red-600 text-white px-3 py-1 rounded-full text-xs font-bold flex items-center gap-2">

<span class="w-2 h-2 bg-white rounded-full animate-pulse"></span>
LIVE

</div>



<div class="absolute bottom-5 left-5 right-5 flex items-end justify-between">


<div class="flex items-center gap-4 text-white">


<div class="w-14 h-14 rounded-2xl bg-white/20 backdrop-blur-md flex items-center justify-center">

<i class="fa-brands fa-tiktok text-3xl"></i>

</div>


<div>

<h3 class="text-xl font-bold">
TikTok
</h3>

<p class="text-sm text-gray-200">
Suivez le culte en direct
</p>

</div>


</div>



<button class="w-14 h-14 rounded-full bg-orange-500 text-white flex items-center justify-center shadow-xl active:scale-90 transition">

<i class="fa-solid fa-play ml-1"></i>

</button>


</div>


</div>
