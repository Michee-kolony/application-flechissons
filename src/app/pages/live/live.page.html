<ion-header class="ion-no-border">

  <ion-toolbar class="px-3 py-1 !bg-gray-50 dark:!bg-black !shadow-sm">

    <div class="flex items-center gap-3 w-full">

      <div class="w-8 h-8 rounded-full bg-orange-100 flex items-center justify-center">

        <ion-back-button
          defaultHref="/tabs/tab1"
          text=""
          class="text-orange-500">
        </ion-back-button>

      </div>


      <div>

        <h1 class="text-base font-bold leading-tight text-gray-900 dark:text-neutral-100">
          Nos directs
        </h1>

        <p class="text-[11px] text-gray-500 dark:text-neutral-400">
          Cultes et moments spirituels en direct
        </p>

      </div>


    </div>

  </ion-toolbar>

</ion-header>





<ion-content [fullscreen]="true" class="!bg-gray-50 dark:!bg-black">


<ion-refresher slot="fixed" (ionRefresh)="chargerLives($event)">
  <ion-refresher-content></ion-refresher-content>
</ion-refresher>


<div class="pt-4 px-4 pb-8 space-y-3">



<div>

<h2 class="text-lg font-bold text-gray-900 dark:text-neutral-100">
Nos plateformes
</h2>


<p class="text-gray-500 dark:text-neutral-400 mt-0.5 text-xs">
Suivez nos cultes et enseignements où que vous soyez.
</p>


</div>





<!-- Chargement -->

<ng-container *ngIf="loading">

<div
*ngFor="let i of [1, 2, 3]"
class="h-36 rounded-2xl bg-gray-200 dark:bg-neutral-800 animate-pulse">
</div>

</ng-container>





<!-- Erreur -->

<div
*ngIf="!loading && erreur"
class="rounded-2xl bg-white dark:!bg-neutral-900 p-6 text-center shadow-sm">

<i class="fa-solid fa-wifi text-2xl text-gray-300 dark:text-neutral-600"></i>

<p class="mt-2 text-sm text-gray-600 dark:text-neutral-300">
{{ erreur }}
</p>

<button
(click)="chargerLives()"
class="mt-4 px-4 py-2 rounded-full bg-orange-500 text-white text-xs font-semibold active:scale-95 transition">
Réessayer
</button>

</div>





<!-- Aucun live -->

<div
*ngIf="!loading && !erreur && lives.length === 0"
class="rounded-2xl bg-white dark:!bg-neutral-900 p-6 text-center shadow-sm">

<i class="fa-solid fa-tower-broadcast text-2xl text-gray-300 dark:text-neutral-600"></i>

<p class="mt-2 text-sm text-gray-600 dark:text-neutral-300">
Aucun direct disponible pour le moment.
</p>

</div>





<!-- Cartes des lives -->

<div
*ngFor="let live of lives; trackBy: trackById"
(click)="ouvrirLive(live)"
class="relative h-36 rounded-2xl overflow-hidden shadow-md group cursor-pointer active:scale-[0.98] transition">


<img
[src]="style(live).image"
[alt]="live.titre"
class="absolute inset-0 w-full h-full object-cover transition duration-700 group-hover:scale-110">


<div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/50 to-black/20"></div>



<div
*ngIf="live.enDirect"
class="absolute top-2.5 right-2.5 bg-red-600 text-white px-2 py-0.5 rounded-full text-[10px] font-bold flex items-center gap-1.5">

<span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span>
LIVE

</div>



<div class="absolute bottom-3 left-3 right-3 flex items-end justify-between gap-3">


<div class="flex items-center gap-2.5 text-white min-w-0">


<div
class="w-10 h-10 shrink-0 rounded-xl backdrop-blur-md flex items-center justify-center"
[ngClass]="style(live).fondIcone">

<i class="text-xl" [ngClass]="style(live).icon"></i>

</div>


<div class="min-w-0">

<h3 class="text-base font-bold leading-tight truncate">
{{ live.titre }}
</h3>

<p class="text-xs text-gray-200 truncate">
{{ live.description || style(live).sousTitre }}
</p>

</div>


</div>



<button
type="button"
[attr.aria-label]="'Ouvrir ' + live.titre"
class="w-10 h-10 shrink-0 rounded-full bg-orange-500 text-white text-sm flex items-center justify-center shadow-lg active:scale-90 transition">

<i class="fa-solid fa-play ml-1"></i>

</button>


</div>


</div>



</div>


</ion-content>
