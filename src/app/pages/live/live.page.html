<ion-header class="ion-no-border">

  <ion-toolbar class="px-3 py-1 !bg-gray-50 dark:!bg-slate-900 !shadow-sm">

    <div class="flex items-center gap-3 w-full">

      <div class="w-8 h-8 rounded-full bg-orange-100 flex items-center justify-center">

        <ion-back-button
          defaultHref="/tabs/tab1"
          text=""
          class="text-orange-500">
        </ion-back-button>

      </div>


      <div>

        <h1 class="text-base font-bold leading-tight text-gray-900 dark:text-slate-100">
          Nos directs
        </h1>

        <p class="text-[11px] text-gray-500 dark:text-slate-400">
          Cultes et moments spirituels en direct
        </p>

      </div>


    </div>

  </ion-toolbar>

</ion-header>





<ion-content [fullscreen]="true" class="!bg-gray-50 dark:!bg-slate-900">


<div class="pt-4 px-4 pb-8 space-y-3">



<div>

<h2 class="text-lg font-bold text-gray-900 dark:text-slate-100">
Nos plateformes
</h2>


<p class="text-gray-500 dark:text-slate-400 mt-0.5 text-xs">
Suivez nos cultes et enseignements où que vous soyez.
</p>


</div>







<!-- TikTok -->

<div class="relative h-36 rounded-2xl overflow-hidden shadow-md group">


<img
src="https://images.unsplash.com/photo-1438232992991-995b7058bbb3?w=1200"
class="absolute inset-0 w-full h-full object-cover transition duration-700 group-hover:scale-110">


<div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/50 to-black/20"></div>



<div class="absolute top-2.5 right-2.5 bg-red-600 text-white px-2 py-0.5 rounded-full text-[10px] font-bold flex items-center gap-1.5">

<span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span>
LIVE

</div>



<div class="absolute bottom-3 left-3 right-3 flex items-end justify-between">


<div class="flex items-center gap-2.5 text-white">


<div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur-md flex items-center justify-center">

<i class="fa-brands fa-tiktok text-xl"></i>

</div>


<div>

<h3 class="text-base font-bold leading-tight">
TikTok
</h3>

<p class="text-xs text-gray-200">
Suivez le culte en direct
</p>

</div>


</div>



<button class="w-10 h-10 rounded-full bg-orange-500 text-white text-sm flex items-center justify-center shadow-lg active:scale-90 transition">

<i class="fa-solid fa-play ml-1"></i>

</button>


</div>


</div>
